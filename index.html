<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bjerking Smash 1.0</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e7e3e1;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        .hero {
            text-align: center;
            padding: 40px 0;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .rank-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .rank-row:last-child {
            border-bottom: none;
        }

        .button {
            display: inline-block;
            background: #111;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="hero">
        <h1>🏓 Bjerking Smash</h1>
        <p>Spela. Registrera. Klättra.</p>
    </div>

    <div class="card">
        <h2>🏆 Ranking</h2>

        <div class="rank-row">
            <span>1. Jonas Samuelsson</span>
            <span>1642</span>
        </div>

        <div class="rank-row">
            <span>2. Saku Heikkilä</span>
            <span>1615</span>
        </div>

        <div class="rank-row">
            <span>3. Karl Nittve</span>
            <span>1588</span>
        </div>
    </div>

    <div class="card">
        <h2>🏓 Senaste matcher</h2>

        <p>Jonas 3-1 Saku</p>
        <p>Karl 3-2 Michel</p>
        <p>David 3-0 Humayoon</p>
    </div>

    <div class="card">
        <h2>🔥 Formstarkast</h2>

        <p>Karl Nittve +87 ELO</p>

        <a href="#" class="button">
ch
        </a>
    </div>

</div>

</body>
</html>
